<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDBMS Teachers Database</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26282c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>

<style>
/* Layout idea: a registry ledger. Charcoal rail + paper work area, one red seal accent for the action that matters. */
:root{
  --paper:#f6f5f1; --card:#ffffff; --ink:#1d1f22; --muted:#666a70; --line:#dcd9d1; --rail:#26282c; --rail-ink:#eceae4;
  --accent:#b3261e; --accent-ink:#ffffff; --soft:#ecebe5;
  --good:#1f7a4d; --warn:#9a6b00; --bad:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#17181a; --card:#202225; --ink:#ecebe6; --muted:#a0a3a8; --line:#34373c; --rail:#101113; --rail-ink:#e4e2dc;
  --accent:#e2574c; --accent-ink:#17181a; --soft:#2a2c30; --good:#55c08a; --warn:#e0b040; --bad:#f0766c;}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#17181a; --card:#202225; --ink:#ecebe6; --muted:#a0a3a8; --line:#34373c; --rail:#101113; --rail-ink:#e4e2dc;
  --accent:#e2574c; --accent-ink:#17181a; --soft:#2a2c30; --good:#55c08a; --warn:#e0b040; --bad:#f0766c;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;background:var(--rail);color:var(--rail-ink);display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:52px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font:700 30px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:14px;opacity:.8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid #ffffff40;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:#9a9a9a}
.pill.live i{background:#4fd08c}.pill.saving i{background:#f0c040}.pill.off i{background:#f0766c}
.tbtn{background:transparent;border:1px solid #ffffff55;color:inherit;border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn:not(:disabled):hover{background:#ffffff1c}
.side{background:var(--rail);color:var(--rail-ink);padding:8px 8px 16px;overflow:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid #ffffff1a}
.side a,.tabbar a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:6px;font-weight:600;font-size:16px;cursor:pointer}
.side a .ic{width:22px;height:22px}
.side a:hover{background:#ffffff14}
.side a.on{background:var(--paper);color:var(--ink)}
.side .sep{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:14px 10px 4px}
.badge{margin-left:auto;font-size:11px;background:#ffffff26;border-radius:99px;padding:0 7px}
.side a.on .badge{background:var(--soft)}
main{overflow:auto;padding:0 20px 80px;min-width:0}
.head{position:sticky;top:0;z-index:6;background:var(--paper);padding-top:16px;padding-bottom:10px;margin-bottom:6px!important;border-bottom:1px solid var(--line)}
.tw{max-height:calc(100vh - 250px);min-height:180px}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1 .ic{width:32px;height:32px}h2 .ic{width:22px;height:22px}
.fld span{display:flex;align-items:center;gap:6px;font-size:13px}
.tab{display:inline-flex;align-items:center;gap:6px}
#logo{height:68px;max-width:220px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;flex:none}
#logo[hidden]{display:none}
#scrollbtns{position:fixed;right:18px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:30}
#scrollbtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:#0078d4;box-shadow:0 4px 14px #0003;cursor:pointer;display:grid;place-items:center}
#scrollbtns button:hover{border-color:#0078d4}#scrollbtns .ic{width:24px;height:24px}
body.out #scrollbtns{display:none}
.owner{font-size:14px;line-height:1.6}.owner b{font-size:15px}
.ownerfoot{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center}
.tabbar{display:none}
h1{display:flex;align-items:center;gap:10px;font:700 34px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{display:flex;align-items:center;gap:8px;font:600 21px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.head>div:first-child{flex:1;min-width:200px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
body.ro .w,body.out .w,body.out .side,body.out .tabbar{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.note{background:var(--soft);border-left:3px solid var(--warn);padding:9px 12px;border-radius:4px;font-size:13.5px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--ink)}
.tile b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.k{background:var(--ink);color:var(--paper);border-color:var(--ink)}.tile.k span{color:inherit;opacity:.75}
.tile.att b{color:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bar{display:grid;grid-template-columns:118px 1fr 28px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.bar .bt{height:14px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--ink);border-radius:2px;min-width:0}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.tools input[type=search],.tools select,.in{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.tools input[type=search]{flex:1;min-width:170px}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 12.5px var(--display);letter-spacing:.09em;text-transform:uppercase;text-align:left;background:var(--soft);padding:8px 10px;white-space:nowrap;position:sticky;top:0;cursor:default}
th.s{cursor:pointer}th.s:hover{text-decoration:underline}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr.c{cursor:pointer}tbody tr.c:hover td{background:var(--soft)}
td.n b{display:block}td.n small{color:var(--muted)}
td.n,th.n{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
th.n{background:var(--soft);z-index:2}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.chip.cg{color:var(--good);border-color:currentColor}.chip.cw{color:var(--warn);border-color:currentColor}.chip.cb{color:var(--bad);border-color:currentColor}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:2px}
.tab{background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rec{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
.photo{width:132px;height:160px;border:1px dashed var(--line);border-radius:6px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
.fld input:disabled,.fld select:disabled{background:var(--soft);opacity:1;color:var(--ink)}
.sec{margin-top:18px}
.sgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;margin-bottom:8px}
.sgrid.q{grid-template-columns:1.6fr .6fr 1fr .6fr 1.2fr}
.sgrid .lab{grid-column:1/-1;font-weight:600;font-size:13px;margin-top:4px}
.saved{font-size:12.5px;color:var(--good);font-weight:600}
#toasts{position:fixed;left:0;right:0;bottom:76px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60;padding:0 16px}
.toast{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px #0005;pointer-events:auto;display:flex;gap:12px;align-items:center;max-width:520px}
.toast.bad{background:var(--bad);color:#fff}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:2px 9px;cursor:pointer;font-weight:600}
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
.dlg{background:var(--card);color:var(--ink);border-radius:10px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:18px}
.dlg h2{margin-bottom:8px}.dlg .row{justify-content:flex-end;margin-top:16px}
.dlg p{margin:6px 0}
.dlg textarea{width:100%;min-height:190px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
.hist{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.hist:first-child{border-top:0}
.hist time{font-size:12px;color:var(--muted);width:92px;flex:none}
.hist div{flex:1;min-width:0}.hist small{color:var(--muted);display:block;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.idc{max-width:420px;width:100%;border:1px solid var(--line);border-radius:8px;display:block}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:52px 0 58px 0;z-index:40}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--rail);color:var(--rail-ink);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar a{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;justify-content:center}
  .tabbar a.on{background:#ffffff22}
  .tabbar svg{width:20px;height:20px}
  main{padding:0 16px 90px}#scrollbtns{bottom:84px;right:12px}#scrollbtns button{width:42px;height:42px}#logo{height:44px;max-width:90px}.brand b{font-size:18px;white-space:normal;line-height:1.1}.tw{max-height:calc(100vh - 300px)}
  h1{font-size:26px}h1 .ic{width:26px;height:26px}
  .brand small{display:none}
  .rec{grid-template-columns:1fr}
  .photo{width:104px;height:126px}
  .bar{grid-template-columns:104px 1fr 26px}
  .sgrid,.sgrid.q{grid-template-columns:1fr 1fr}
  .sgrid>.fld:first-of-type{grid-column:1/-1}
  .pill span{display:none}
}
@media (prefers-reduced-motion:no-preference){.bar .bt i{transition:width .3s}}

/* ---- Sign-in page ---- */
body.out .top{display:none}
body.out main{grid-column:1/-1;grid-row:1/-1;padding:0}
.lg-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;background:linear-gradient(160deg,var(--rail) 0 38%,var(--paper) 38%)}
.lg-card{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.lg-brand{background:var(--rail);color:var(--rail-ink);padding:40px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;border-right:6px solid var(--accent)}
.lg-logo{width:190px;height:190px;object-fit:contain;background:#fff;border-radius:16px;padding:10px}
.lg-logo.none{display:flex;align-items:center;justify-content:center;font:700 54px var(--display);color:var(--accent)}
.lg-title{font:700 44px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 0;border:0;padding:0}
.lg-brand .org{font-size:16px;opacity:.85;line-height:1.45}
.lg-brand .sch{font:600 18px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px}
.lg-form{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.lg-form h1{font:700 40px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.lg-form h1 .ic{width:38px;height:38px}
.lg-form .sub{font-size:16px;margin:0 0 22px}
.lg-f{display:block;margin-bottom:18px}
.lg-f>span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-bottom:8px}
.lg-f>span .ic{width:22px;height:22px}
.lg-f input,.lg-f select{width:100%;height:56px;font-size:19px;padding:0 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.lg-f input:focus,.lg-f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.lg-go{width:100%;height:60px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 22px var(--display);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;margin-top:6px}
.lg-go .ic{width:28px;height:28px;color:#fff!important}
.lg-go:disabled{opacity:.7;cursor:wait}
.lg-go:hover:not(:disabled){filter:brightness(1.1)}
.lg-help{font-size:14px;color:var(--muted);margin-top:16px;text-align:center}
.lg-wrap .ownerfoot{max-width:980px;margin-top:18px}
@media (max-width:760px){.lg-card{grid-template-columns:1fr}.lg-brand{border-right:0;border-bottom:6px solid var(--accent);padding:28px 20px}.lg-logo{width:130px;height:130px}.lg-title{font-size:34px}.lg-form{padding:28px 22px}.lg-form h1{font-size:32px}.lg-wrap{padding:0;justify-content:flex-start;background:var(--paper)}.lg-card{border-radius:0;box-shadow:none}}

.pill.yr{background:#c8a400;color:#1d1f22;border-color:#c8a400;font-weight:700;font-size:14px;padding:5px 12px;cursor:pointer}
.pill.yr.past{background:#b3261e;color:#fff;border-color:#b3261e}
.pill.yr .ic{width:16px;height:16px}
@media (max-width:760px){.bt,.yl{display:none}.pill.yr{font-size:13px;padding:4px 8px;gap:4px}}
.prevpost{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.prevpost b{color:var(--accent)}
.yrlist{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.yrlist div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.yrlist div.on{border:2px solid #c8a400;background:color-mix(in srgb,#c8a400 12%,transparent)}
.yrlist b{display:block;font-size:22px}
</style>
</head>
<body class="out">
<div id="app">
  <header class="top">
    <img id="logo" alt="School logo" hidden>
    <div class="brand"><b>TDBMS<span class="bt"> Teachers Database</span></b><small id="orgline">Western Provincial Administration · Division of Education · Middle Fly District</small></div>

</script>

const isNet=e=>{const m=String(e&&e.message||e||'');if(/(AUTH|DENIED|GONE): /.test(m))return false;return !navigator.onLine||/network|HTTP 0|connection|timed? ?out|failed to fetch|unable to|load failed/i.test(m)};
function outbox(v){try{if(v===undefined)return JSON.parse(localStorage.getItem('tdbms_outbox')||'[]');v.length?localStorage.setItem('tdbms_outbox',JSON.stringify(v)):localStorage.removeItem('tdbms_outbox')}catch(e){return []}}

function waiting(){return outbox().filter(x=>AUTH&&x.by===AUTH.name).length}
function offPill(){const n=waiting();setSync('off',n?`Offline · ${n} waiting`:'Offline')}

let flushing=false;
async function flush(){if(flushing||!AUTH)return false;let q=outbox();if(!q.some(x=>x.by===AUTH.name))return false;flushing=true;let last=null,sent=0;const map={},touched=new Set();
  setSync('saving','Uploading');
  try{for(;;){q=outbox();const i=q.findIndex(x=>x.by===AUTH.name);if(i<0)break;const it=q[i];
      it.ops.forEach(o=>{const [k,id]=o.p.split('/');if(map[id]){o.p=k+'/'+map[id];if(o.a&&o.a.id)o.a.id=map[id]}});
      try{const r=await server('apiApply',it.label+' (entered offline)',it.ops,it.light);last=r;sent++;Object.assign(map,r.ids||{});it.ops.forEach(o=>{const [k,id]=o.p.split('/');if(k==='teachers'&&o.a)touched.add(map[id]||id)});Object.keys(r.ids||{}).forEach(o=>{if(S.rec===o)S.rec=r.ids[o]})}
      catch(e){if(isNet(e)){offPill();return false}if(/AUTH/.test(String(e&&e.message))){flushing=false;signOut(true);return false}
        toast('One offline change could not be saved: '+errText(e),'bad')}
      q=outbox();q.splice(q.indexOf(q.find(x=>x.at===it.at&&x.by===it.by)),1);outbox(q)}
    if(last){ingest(last.state);reapplyOutbox();soon()}
    const warn=[];touched.forEach(id=>{const t=S.T[id];if(!t)return;const d=dups(id,t,0);if(d.length)warn.push(`<p><b>${esc(full(t))}</b>:</p><ul>${d.map(x=>`<li>${x}</li>`).join('')}</ul>`)});
    if(warn.length)setTimeout(()=>ask('Check these offline entries',`<p>While you were offline, someone else may have entered the same teacher. Please check:</p>${warn.join('')}<p>Open each record and fix it, or move the extra one to the Recycle Bin.</p>`,'OK'),300);
    setSync('live',S.canWrite?'Live':'Live · view only');if(sent)toast(`Uploaded ${sent} change(s) made while offline.`);return true}
  finally{flushing=false}}

  try{const r=await server('apiApply',label,ops,!!light);if(!pending)ingest(r.state);setSync('live','Live');soon();return r}
  catch(e){if(isNet(e)){queue(label,ops,light);toast('No network. Saved on this device. It will upload by itself when the network is back.');return {ids:{},queued:true}}
    setSync('off','Not saved');toast(errText(e),'bad');if(/AUTH/.test(String(e&&e.message)))return signOut(true),null;try{ingest(await call('apiPoll',AUTH,-1));render()}catch(x){}return null}}

function dups(exId,v,mode){const out=[];let n,f,p;const eq=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();

    if((!mode||mode===1)&&v.surname&&v.given&&!n&&eq(t.surname,v.surname)&&eq(t.given,v.given))n=full(t);
    if((!mode||mode===2)&&v.fileNo&&!f&&(eq(t.fileNo,v.fileNo)||eq(t.id,v.fileNo)))f=full(t);
    if((!mode||mode===3)&&v.posNo&&!p&&eq(t.posNo,v.posNo))p=full(t)}
  if(n)out.push(`Same name already exists: <b>${esc(n)}</b>`);if(f)out.push(`File number ${esc(v.fileNo)} is already used by <b>${esc(f)}</b>`);if(p)out.push(`Position number ${esc(v.posNo)} is already held by <b>${esc(p)}</b>`);return out}

  if(k==='school'&&v){const o=teachers().find(x=>x.id!==t.id&&String(x.school||'').toLowerCase()===v.toLowerCase());
    if(o)['schoolCode','category'].forEach(f=>{if(!t[f]&&o[f]){b[f]='';a[f]=o[f]}})}
  if(await commit(`${FM[k].label} of ${nm(t)}`,[{p:'teachers/'+t.id,b,a}])){const s=$('#savednote');if(s){s.textContent='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}}}
async function saveNew(){const d={};KEYS.forEach(k=>d[k]=clean(k,S.draft[k]));if(!d.surname){toast('Surname is required.','bad');S.tab='personal';render();return}
  const dd=dups('',d,0);if(dd.length&&!(await ask('Duplicate detected',dd.map(x=>`<p>${x}</p>`).join('')+'<p>Save this teacher anyway?</p>','Save anyway')))return;
  const id=nextId();d.id=id;S.rec=id;S.mode='view';if(await commit(`Added ${nm(d)}`,[{p:'teachers/'+id,b:null,a:d,auto:true}])){S.draft={};toast(`Saved with ID ${S.rec}.`);render()}else{S.mode='new';S.rec=null;render()}}

  if(await commit(`Deleted ${nm(t)}`,[{p:'teachers/'+id,b:t,a:null},{p:'bin/'+id,b:null,a:{...t,deletedAt:Date.now()}}])){S.rec=null;go('teachers');toast('Moved to the Recycle bin.','',{label:'Undo',fn:doUndo})}}
async function restore(id){const r=S.bin[id];if(!r)return;const t={...r};delete t.deletedAt;let nid=id;if(S.T[id]){nid=nextId();t.id=nid}

 body(){const all=S.school==='(ALL SCHOOLS)';let rows=teachers().filter(t=>String(t.school||'').trim()&&(all||t.school===S.school));const pos=S.schoolMode==='pos';
  rows.sort((a,b)=>cmp(a.school,b.school)||(pos?-cmp(a.posNo,b.posNo):cmp(a.surname,b.surname)||cmp(a.given,b.given)));const f=rows[0]||{};const tot=rows.length;rows=rows.filter(t=>match(t,S.q.schools));
  const cols=['schoolCode','posNo','level',...(pos?['position']:[]),'fileNo','apptType','eligibility','subLevel'];
  const info=`<div class="card" style="margin-bottom:10px"><dl class="kv"><dt>School code</dt><dd>${all?'-':esc(f.schoolCode||'')}</dd><dt>School category</dt><dd>${all?'-':esc(f.category||'')}</dd><dt>Sector</dt><dd>${all?'-':esc(f.sector||'')}</dd><dt>Total teachers</dt><dd><b>${tot}</b></dd></dl></div>`;
  if(!rows.length)return info+`<div class="tw"><div class="empty">No teachers found for this school.</div></div>`;
  return info+`<div class="tw"><table><thead><tr><th>No.</th><th class="n">Teacher</th><th>School Name</th>${cols.map(k=>`<th>${esc({level:'Position Level',position:'Position Designation',apptType:'Status (Acting/Tenure)',subLevel:'Teacher Sub Level'}[k]||FM[k].label)}</th>`).join('')}</tr></thead><tbody>${
   rows.map((t,i)=>`<tr class="c" data-go="record" data-id="${esc(t.id)}"><td>${i+1}</td><td class="n"><b>${esc(nm(t))}</b><small>${esc(t.id)}</small></td><td>${esc(t.school)}</td>${cols.map(k=>`<td>${cell(t,k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}};
/* Entry form */
function fld(k,t,cls){const f=FM[k],v=String(t[k]??''),id='f_'+k,dis=S.canWrite?'':'disabled';let inp;
  if(DEF_LISTS[f.type]){const o=listOf(f.type);inp=`<select id="${id}" data-k="${k}" ${dis}><option value=""></option>${[...new Set([...o,...(v?[v]:[])])].map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
  else inp=`<input id="${id}" data-k="${k}" type="${f.type==='date'?'date':'text'}" ${f.type==='num'?'inputmode="numeric"':''} ${f.type==='school'?'list="dl_schools"':''} value="${esc(v)}" autocomplete="off" ${dis}>`;
  return `<label class="fld ${cls||''}" for="${id}"><span>${esc(f.short||f.label)}</span>${inp}</label>`}
function short(k,s){FM[k].short=s}
[['spouseEmployer','Employer'],['spouseFileNo','File/Work No.'],['spouseProvince','Home Province'],['spouseDistrict','Home District'],['spouseLLG','Home LLG'],['spouseVillage','Home Village'],['apptType','Type (Acting/Tenure)']].forEach(a=>short(...a));
function prevCard(t){if(S.viewYear||S.mode==='new'||!t)return '';const p=S.prev&&S.prev[t.id],py=actY()-1;
  if(!p)return S.Y&&S.Y.active>S.Y.first?`<div class="prevpost"><b>${py} posting:</b> <span class="sub">not in the ${py} copy (new this year).</span></div>`:'';
  const same=['school','schoolCode','position','postStatus','level','posNo'].every(k=>String(p[k]||'')===String(t[k]||''));
  return `<div class="prevpost"><b>${py} posting:</b> ${esc([p.school,p.schoolCode&&'('+p.schoolCode+')',p.position,p.level,p.postStatus,p.posNo&&'Pos. '+p.posNo].filter(Boolean).join(' · ')||'none recorded')}
   <div class="sub" style="margin-top:4px">${same?'Carried over unchanged to '+actY()+'. Change any box below if this teacher\'s '+actY()+' posting is different.':'Changed for '+actY()+' (see the boxes below).'}</div></div>`}
function tabHtml(tab,t){let h=(tab.id==='posting'?prevCard(t):'')+(tab.f.length?`<div class="grid">${tab.f.map(k=>fld(k,t)).join('')}</div>`:'');
  if(tab.x==='deps'){h+=`<div class="sec"><h2>Dependents</h2>`;for(let i=1;i<=4;i++){['Name','Dob','Rel'].forEach((s,j)=>short(`dep${i}${s}`,['Name','Date of birth','Relationship'][j]));h+=`<div class="sgrid"><div class="lab">Dependent ${i}</div>${fld(`dep${i}Name`,t)}${fld(`dep${i}Dob`,t)}${fld(`dep${i}Rel`,t)}</div>`}h+='</div>'}
  if(tab.x==='school'){const g=(lab,ks,ls)=>{ks.forEach((k,i)=>short(k,ls[i]));return `<div class="sgrid q"><div class="lab">${lab}</div>${ks.map(k=>fld(k,t)).join('')}</div>`};
   h+=`<div class="sec"><h2>Schooling</h2>${g('College attended',['college','collegeProv','collegeYears','collegeQual'],['Institution','Province','Years','Qualification'])}${g('Secondary',['secSchool','secGrade','secProv','secYears','secQual'],['School','Grade','Province','Years','Qualification'])}${g('FODE',['fodeSchool','fodeGrade','fodeYear','fodeQual'],['School','Grade','Year','Qualification'])}</div>`}
  if(tab.x==='files')h+=filesPanel(t);
  if(tab.id==='posting'&&S.mode!=='new'){const tx=Object.values(S.X).filter(x=>x.tid===t.id).sort((a,b)=>cmp(b.date,a.date));
   h+=`<div class="sec"><h2>Transfer history</h2>${tx.length?`<div class="tw" style="min-height:0"><table><thead><tr><th>Date</th><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${esc(fdate(x.date))}</td><td>${esc(trType(x))}</td><td>${esc(trFrom(x))}</td><td>${esc(trTo(x))}</td><td>${trChip(x.status)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">No transfers recorded for this teacher.</p>'}</div>`}
  return h}
function filesPanel(t){if(S.mode==='new')return '<div class="empty">Save the teacher first, then add documents.</div>';const mine=Object.entries(S.files).filter(([,f])=>f.tid===t.id);
  let h=`<div class="tw">${mine.length?`<table><thead><tr><th>Category</th><th>Item</th><th>File</th><th>Uploaded</th><th></th></tr></thead><tbody>${mine.map(([id,f])=>`<tr><td>${esc(f.cat)}</td><td>${esc(f.item)}</td><td><button type="button" class="btn sm" data-act="fileopen" data-id="${id}">${esc(f.name)}</button></td><td>${new Date(f.at).toLocaleDateString()}</td><td><button class="btn sm danger w" data-act="filedel" data-id="${id}">Remove</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No documents for this teacher yet.</div>'}</div>`;
  if(S.canWrite)h+=`<div class="card w" style="margin-top:10px"><h2>Add a document</h2><div class="grid"><label class="fld" for="up_cat"><span>Category</span><select id="up_cat"><option>Birth Certificate</option><option>Foster Certificate</option><option>Leave Form</option><option>Ticket Proforma</option><option>Other</option></select></label><label class="fld" for="up_item"><span>Item (e.g. Dependent 1, Leave 2026)</span><input id="up_item"></label><label class="fld" for="up_file"><span>PDF, image or Word file, up to 8 MB</span><input type="file" id="up_file"></label></div><div class="row" style="margin-top:10px"><button type="button" class="btn pri" data-act="fileup">Upload</button></div></div>`;return h}
VIEWS.record={html(){const isNew=S.mode==='new',t=isNew?S.draft:S.T[S.rec];
  const pick=`<div class="tools"><input type="search" id="pick" list="dl_teachers" placeholder="Search / select teacher" value="${t&&!isNew?esc(full(t)):''}" aria-label="Search or select teacher"><button class="btn go w" data-act="new">+ Add teacher</button></div>`;
  if(!t)return `<div class="head"><div><h1>Entry form</h1><p class="sub">Pick a teacher to view or edit, or add a new one.</p></div></div>${pick}<div class="card empty">${S.rec?'That teacher is no longer in the database. It may have been deleted by another user.':'No teacher selected.'}</div>`;
  const tab=TABS.find(x=>x.id===S.tab)||TABS[0];
  return `<div class="head"><div><h1>${isNew?'New teacher':esc(nm(t))}</h1><p class="sub">${isNew?`Teacher ID is generated when you save (next: ${nextId()}).`:`${esc(t.id)} · ${esc(t.position||'')}${t.school?' · '+esc(t.school):''} <span class="saved" id="savednote"></span>`}</p></div>
  <div class="row">${isNew?`<button class="btn" data-act="cancelnew">Cancel</button><button class="btn go" data-act="savenew">Save new teacher</button>`:`<button class="btn" data-act="idcard">ID card</button><button class="btn" data-act="email">Email officer</button><button class="btn danger w" data-act="del">Delete</button>`}</div></div>
  ${isNew?'':pick}${isNew?'':'<p class="sub w" style="margin:-4px 0 0">Changes save automatically when you leave a field. Use Undo to take one back.</p>'}
  <div class="tabs" role="tablist">${TABS.filter(x=>!(isNew&&x.id==='files')).map(x=>`<button class="tab ${x.id===tab.id?'on':''}" data-act="tab" data-id="${x.id}" role="tab">${x.t}</button>`).join('')}</div>
  <form id="recform" class="card" onsubmit="return false">${tab.id==='personal'&&!isNew?`<div class="rec"><div><div class="photo" id="photo">No ID photo</div><div class="row w" style="margin-top:6px"><label class="btn sm" for="ph_in">Add photo</label><input type="file" id="ph_in" accept="image/*" hidden><button type="button" class="btn sm" data-act="phclear">Clear</button></div></div><div>${tabHtml(tab,t)}</div></div>`:tabHtml(tab,t)}</form>`},
 after(){if(S.mode==='view'&&S.rec)loadPhoto(S.rec)}};
function patchForm(){const t=S.T[S.rec];document.querySelectorAll('#recform [data-k]').forEach(el=>{if(el===document.activeElement)return;const v=String(t[el.dataset.k]??'');if(el.value!==v){if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===v))el.add(new Option(v,v));el.value=v}});
  if(S.tab==='files'){const f=$('#recform');if(f&&!f.contains(document.activeElement))f.innerHTML=tabHtml(TABS.find(x=>x.id==='files'),t)}
  const h=$('#main h1');if(h)h.textContent=nm(t)}
async function loadPhoto(id){const box=$('#photo');if(!box)return;const put=img=>{const b=$('#photo');if(b&&S.rec===id)b.innerHTML=img?`<img alt="ID photo" src="${img}">`:'No ID photo'};
  if(id in S.photo)return put(S.photo[id]);try{S.photo[id]=await call('apiPhoto',AUTH,id);put(S.photo[id])}catch(e){}}

/* Transfers */
const TR=[['tid','Teacher ID'],['name','Teacher name'],['fileNo','File No'],['type','Transfer type'],['date','Date effective'],['fromSchool','From school'],['fromDistrict','From district'],['fromProvince','From province'],
 ['toSchool','To school'],['toCode','To school code'],['toDistrict','To district'],['toProvince','To province'],['position','Position'],['ref','Approval / instrument No'],['reason','Reason'],['status','Status'],['remarks','Remarks']];
const TR_TYPES=['School to school (same district)','In: from another district (same province)','In: from another province','Out: to another district (same province)','Out: to another province'];
const TR_OLD={'From another district':TR_TYPES[1],'From another province':TR_TYPES[2]};
const trType=x=>TR_OLD[x.type]||x.type;
// for each type, which of [from district, from province, to district, to province] is this database's own district/province
const TR_HOME={[TR_TYPES[0]]:[1,1,1,1],[TR_TYPES[1]]:[0,1,1,1],[TR_TYPES[2]]:[0,0,1,1],[TR_TYPES[3]]:[1,1,0,1],[TR_TYPES[4]]:[1,1,0,0]};
const TR_STATUS=['Pending','Approved','Arrived / took up duty','Cancelled'];
const trChip=v=>v?`<span class="chip ${{'Arrived / took up duty':'cg','Approved':'cw','Pending':'cw','Cancelled':'cb'}[v]||''}">${esc(v)}</span>`:'';
const trFrom=x=>[x.fromSchool,x.fromDistrict,x.fromProvince].filter(Boolean).join(', ');
const trTo=x=>[x.toSchool,x.toDistrict,x.toProvince].filter(Boolean).join(', ');
VIEWS.transfers={html(){const yrs=[...new Set([String(new Date().getFullYear()),...Object.values(S.X).map(x=>String(x.date||'').slice(0,4)).filter(Boolean)])].sort().reverse();
  return `<div class="head"><div><h1>Transfers</h1><p class="sub">Teachers moving school mid-year, or arriving from another district or province.</p></div><div class="row"><button class="btn go w" data-act="trnew">+ Record transfer</button></div></div>
  <div class="tools"><select id="trf_year" aria-label="Year"><option value="">All years</option>${yrs.map(y=>`<option ${S.trYear===y?'selected':''}>${y}</option>`).join('')}</select>
  <select id="trf_type" aria-label="Transfer type"><option value="">All transfer types</option>${TR_TYPES.map(t=>`<option ${S.trType===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
  <input type="search" id="q_transfers" placeholder="Search name, File No, school" value="${esc(S.q.transfers||'')}"></div><div id="vbody">${this.body()}</div>`},
 body(){let all=Object.values(S.X).filter(x=>!S.trYear||String(x.date||'').startsWith(S.trYear));const q=(S.q.transfers||'').toLowerCase();
  const cnt=t=>all.filter(x=>trType(x)===t&&x.status!=='Cancelled').length;
  let rows=all.filter(x=>!S.trType||trType(x)===S.trType).filter(x=>!q||[x.name,x.fileNo,x.tid,x.fromSchool,x.toSchool,x.ref].join(' ').toLowerCase().includes(q)).sort((a,b)=>cmp(b.date,a.date));
  const tiles=`<div class="tiles">${[['School to school (same district)',cnt(TR_TYPES[0])],['In from another district',cnt(TR_TYPES[1])],['In from another province',cnt(TR_TYPES[2])],['Out to another district',cnt(TR_TYPES[3])],['Out to another province',cnt(TR_TYPES[4])],['Pending / approved',all.filter(x=>['Pending','Approved'].includes(x.status)).length]].map(([l,n],i)=>`<div class="tile ${i===5?'att':''}" style="cursor:default"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
  if(!rows.length)return tiles+`<div class="tw"><div class="empty">No transfers recorded${S.trYear?' for '+esc(S.trYear):''}.</div></div>`;
  return tiles+`<div class="tw"><table><thead><tr><th>No.</th><th>Date</th><th class="n">Teacher</th><th>File No</th><th>Type</th><th>From</th><th>To</th><th>Approval No</th><th>Status</th></tr></thead><tbody>${
   rows.map((x,i)=>`<tr class="c" data-act="tredit" data-id="${esc(x.id)}"><td>${i+1}</td><td>${esc(fdate(x.date))}</td><td class="n"><b>${esc(x.name)}</b><small>${esc(x.tid||'not in database')}</small></td><td>${esc(x.fileNo)}</td><td>${esc(trType(x))}</td><td>${esc(trFrom(x))}</td><td>${esc(trTo(x))}</td><td>${esc(x.ref)}</td><td>${trChip(x.status)}</td></tr>`).join('')}</tbody></table></div>`}};
function trForm(id){const old=id?S.X[id]:null,x={...(old||{status:'Pending',date:new Date().toISOString().slice(0,10)})};
  const f=(k,l)=>{const v=esc(x[k]||'');let inp;
   if(k==='type'){const cur=x[k]?trType(x):'',opts=TR_TYPES.includes(cur)||!cur?TR_TYPES:[...TR_TYPES,cur];inp=`<select id="tr_${k}"><option value=""></option>${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
   else if(k==='status')inp=`<select id="tr_${k}">${TR_STATUS.map(o=>`<option ${o===x[k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
   else if(k==='date')inp=`<input id="tr_${k}" type="date" value="${v}">`;
   else if(k==='reason'||k==='remarks')inp=`<input id="tr_${k}" value="${v}">`;
   else inp=`<input id="tr_${k}" value="${v}" ${/School$/.test(k)?'list="dl_schools"':''} ${k==='tid'?'readonly':''} autocomplete="off">`;
   return `<label class="fld" for="tr_${k}"><span>${l}</span>${inp}</label>`};
  const d=dialog(`<h2>${old?'Edit transfer':'Record transfer'}</h2>
   <label class="fld" for="tr_pick"><span>Teacher already in the database? Pick them (leave blank for a new arrival)</span><input id="tr_pick" list="dl_teachers" value="${x.tid&&S.T[x.tid]?esc(full(S.T[x.tid])):''}" autocomplete="off"></label>
   <div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${TR.map(([k,l])=>f(k,l)).join('')}</div>
   <label id="tr_updl" style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="tr_upd"> Also change this teacher's school in the master record to the "To school"</label>
   <div class="row" style="justify-content:space-between"><span>${old?'<button class="btn danger" id="tr_del">Delete</button>':''}</span><span class="row"><button class="btn" data-act="close">Cancel</button><button class="btn go" id="tr_save">Save transfer</button></span></div>`);
  const g=k=>$('#tr_'+k,d);
  g('pick').onchange=()=>{const t=S.T[idFrom(g('pick').value)];if(!t)return;g('tid').value=t.id;g('name').value=nm(t);g('fileNo').value=t.fileNo||'';g('position').value=t.position||'';if(!g('fromSchool').value)g('fromSchool').value=t.school||''};
  g('type').onchange=()=>{const m=TR_HOME[g('type').value];if(!m)return;const D=S.Y.district,P=S.Y.province;
   [['fromDistrict',D,0],['fromProvince',P,1],['toDistrict',D,2],['toProvince',P,3]].forEach(([k,v,i])=>{const el=g(k);if(m[i])el.value=v;else if(el.value===v)el.value=''});
   const out=/^Out:/.test(g('type').value);$('#tr_updl',d).style.display=out?'none':'flex';if(out)g('upd').checked=false};
  g('status').onchange=()=>{if(/Arrived/.test(g('status').value)&&g('tid').value&&!/^Out:/.test(g('type').value))g('upd').checked=true};
  g('save').onclick=async()=>{const r={};TR.forEach(([k])=>r[k]=g(k).value.trim());
   if(!r.name)return toast('Enter the teacher name, or pick the teacher.','bad');if(!r.type)return toast('Choose the transfer type.','bad');if(!r.date)return toast('Enter the date effective.','bad');
   const nid=id||'TR-'+Date.now().toString(36).toUpperCase();r.id=nid;r.by=old?old.by||S.me:S.me;r.at=old?old.at:new Date().toISOString().slice(0,10);
   const ops=[{p:'transfers/'+nid,b:old,a:r}];const t=S.T[r.tid];
   if(g('upd').checked&&t&&r.toSchool){const b={school:t.school||'',schoolCode:t.schoolCode||''},a={school:r.toSchool,schoolCode:r.toCode||t.schoolCode||''};ops.push({p:'teachers/'+t.id,b,a})}
   closeDialog();if(await commit(`${old?'Updated':'Recorded'} transfer of ${r.name}`,ops))toast(old?'Transfer updated.':'Transfer recorded.')};
  const del=$('#tr_del',d);if(del)del.onclick=async()=>{closeDialog();if(await commit(`Deleted transfer of ${old.name}`,[{p:'transfers/'+id,b:old,a:null}]))toast('Transfer deleted.','',{label:'Undo',fn:doUndo})}}

/* Recycle bin */
VIEWS.bin={html(){return `<div class="head"><div><h1>Recycle bin</h1><p class="sub">Deleted teachers are kept 30 days, then removed.</p></div><div class="row w"><button class="btn danger" data-act="binempty">Empty recycle bin</button></div></div><div id="vbody">${this.body()}</div>`},
 body(){const rows=Object.values(S.bin).sort((a,b)=>b.deletedAt-a.deletedAt);if(!rows.length)return '<div class="tw"><div class="empty">The recycle bin is empty.</div></div>';
  return `<div class="tw"><table><thead><tr><th class="n">Teacher</th><th>Deleted on</th><th>Days left</th><th>School</th><th>Position</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td class="n"><b>${esc(nm(t))}</b><small>${esc(t.id)}</small></td><td>${new Date(t.deletedAt).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</td><td>${Math.max(0,30-Math.floor((Date.now()-t.deletedAt)/864e5))}</td><td>${esc(t.school)}</td><td>${esc(t.position)}</td><td><button class="btn sm pri w" data-act="restore" data-id="${esc(t.id)}">Restore</button></td></tr>`).join('')}</tbody></table></div>`}};
/* Attachments register */
VIEWS.files={html(){return `<div class="head"><div><h1>Attachments</h1><p class="sub">Birth and foster certificates, leave forms, ticket proformas. Upload from a teacher's Documents tab.</p></div></div><div class="tools"><input type="search" id="q_files" placeholder="Search Empl. No or name" value="${esc(S.q.files||'')}"></div><div id="vbody">${this.body()}</div>`},
 body(){const q=(S.q.files||'').toLowerCase();const rows=Object.entries(S.files).map(([id,f])=>({id,...f,t:S.T[f.tid]})).filter(f=>!q||(f.tid+' '+(f.t?nm(f.t)+' '+f.t.fileNo:'')+' '+f.name).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at);
  if(!rows.length)return '<div class="tw"><div class="empty">No documents uploaded yet.</div></div>';
  return `<div class="tw"><table><thead><tr><th>No.</th><th class="n">Teacher</th><th>File No</th><th>Category</th><th>Item</th><th>File name</th><th>Uploaded on</th></tr></thead><tbody>${rows.map((f,i)=>`<tr><td>${i+1}</td><td class="n"><b>${esc(f.t?nm(f.t):'(deleted)')}</b><small>${esc(f.tid)}</small></td><td>${esc(f.t?f.t.fileNo:'')}</td><td>${esc(f.cat)}</td><td>${esc(f.item)}</td><td><button class="btn sm" data-act="fileopen" data-id="${f.id}">${esc(f.name)}</button></td><td>${new Date(f.at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</td></tr>`).join('')}</tbody></table></div>`}};
/* Activity */
VIEWS.activity={html(){return `<div class="head"><div><h1>Activity</h1><p class="sub">Every change, by every user, newest first. Revert puts the old values back.</p></div></div><div class="card" id="vbody">${this.body()}</div>`},
 body(){if(!S.hist.length)return '<div class="empty">No changes recorded yet.</div>';return S.hist.map(h=>{let det='';try{const o=h.ops&&JSON.parse(h.ops);if(o&&o.length===1&&o[0].a&&o[0].b)det=Object.keys(o[0].a).map(k=>`${FM[k]?FM[k].label:k}: ${o[0].b[k]||'(blank)'} → ${o[0].a[k]||'(blank)'}`).join('; ')}catch(e){}
   return `<div class="hist"><time>${new Date(h.at).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</time><div><b>${esc(h.label)}</b><small>${esc(h.by===S.me?'You':h.by||'A user')}${det?' · '+esc(det):''}</small></div>${h.ops?`<button class="btn sm w" data-act="revert" data-id="${h.id}">Revert</button>`:''}</div>`}).join('')}};
/* Setup */
VIEWS.setup={html(){return `<div class="head"><div><h1>Setup</h1><p class="sub">Signed in as ${esc(S.me)} (${esc(S.role)}).</p></div><div class="row"><button class="btn" data-act="signout">Sign out</button></div></div>
  ${S.role==='Admin'?`<div class="card" style="margin-bottom:12px"><h2>Users and data</h2><p class="sub" style="margin-bottom:10px">Add or remove officers, and change PINs, on the Users tab of the Google Sheet. All records are kept in the same sheet.</p><div class="row"><a class="btn pri" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">Open the Google Sheet</a></div></div>`:''}
  ${(()=>{const Y=S.Y||{},ys=[Y.first,Y.first+1,Y.first+2],adm=S.role==='Admin'&&!S.viewYear;
   return `<div class="card" style="margin-bottom:12px"><h2>Database years</h2><p class="sub" style="margin-bottom:6px">The database runs for 3 years. Each new year starts with every teacher carried over from the year before; a read-only copy of each finished year is kept.</p>
   <div class="yrlist">${ys.map(y=>`<div class="${y===Y.active?'on':''}"><b>${y}</b><span class="sub">${y===Y.active?'Active year':y<Y.active?'Closed · view only':'Not started'}</span></div>`).join('')}</div>
   ${adm?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"><label class="fld" for="yr_first"><span>First year of the 3</span><input id="yr_first" type="number" min="2000" max="2099" value="${Y.first}"></label>
   <label class="fld" for="yr_d"><span>This district</span><input id="yr_d" value="${esc(Y.district||'')}"></label><label class="fld" for="yr_p"><span>This province</span><input id="yr_p" value="${esc(Y.province||'')}"></label></div>
   <div class="row" style="margin-top:10px"><button class="btn" data-act="yrsave">Save years</button>${Y.active<Y.first+2?`<button class="btn go" data-act="yrnext">Start ${Y.active+1}</button>`:'<span class="sub">'+Y.active+' is the last year of this period.</span>'}</div>`:`<p class="sub">${S.viewYear?'Go back to the active year to change these.':'Only an Admin can change the years.'}</p>`}</div>`})()}
  <div class="card" style="margin-bottom:12px"><h2>System owner</h2><div class="owner"><b>${esc(OWNER[0])}</b><br>${OWNER.slice(1).map(esc).join('<br>')}</div></div>
  <div class="card" style="margin-bottom:12px"><h2>School logo</h2><p class="sub" style="margin-bottom:10px">Shown at the top of every page, for every user. Use a PNG or JPG; it is resized to fit.</p>
  <div class="row">${S.logo?`<img src="${S.logo}" alt="Current logo" style="height:80px;max-width:240px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px">`:'<span class="sub">No logo yet.</span>'}
  <label class="btn pri w" for="logo_in">${S.logo?'Change logo':'Add logo'}</label><input type="file" id="logo_in" accept="image/*" hidden>${S.logo?'<button class="btn danger w" data-act="logodel">Remove logo</button>':''}</div></div>
  <div class="card" style="margin-bottom:12px"><h2>Excel</h2><p class="sub" style="margin-bottom:10px">Import reads the TeachersDB sheet of your TDBMS workbook (.xlsm or .xlsx). Teachers are matched on Teacher ID: new IDs are added, existing ones updated. Export saves every teacher in the same column layout.</p>
  <div class="row"><label class="btn pri w" for="imp_in">Import from Excel</label><input type="file" id="imp_in" accept=".xlsx,.xlsm,.xls,.csv" hidden><button class="btn" data-act="export">Export to Excel</button></div></div>
  <div class="card" style="margin-bottom:12px"><h2>Email contacts</h2><div id="contacts">${S.contacts.map((c,i)=>`<div class="sgrid"><label class="fld" for="c_r${i}"><span>Role</span><input id="c_r${i}" data-c="${i}" data-ck="role" value="${esc(c.role)}"></label><label class="fld" for="c_o${i}"><span>Officer</span><input id="c_o${i}" data-c="${i}" data-ck="officer" value="${esc(c.officer)}"></label><label class="fld" for="c_e${i}"><span>Email address</span><input id="c_e${i}" data-c="${i}" data-ck="email" value="${esc(c.email)}"></label></div>`).join('')||'<p class="sub">No contacts yet.</p>'}</div><div class="row w" style="margin-top:8px"><button class="btn sm" data-act="cadd">+ Add contact</button></div></div>
  <div class="card"><h2>Dropdown lists</h2><p class="sub" style="margin-bottom:10px">One option per line. Changes apply for every user.</p><div class="grid">${Object.keys(LIST_NAMES).map(n=>`<label class="fld" for="l_${n}"><span>${LIST_NAMES[n]}</span><textarea id="l_${n}" data-list="${n}" rows="${Math.min(8,listOf(n).length+1)}">${esc(listOf(n).join('\n'))}</textarea></label>`).join('')}</div></div>`}};

/* ---------- actions ---------- */
const ACT={
 new(){S.mode='new';S.draft={};S.tab='personal';go('record')},
 cancelnew(){S.mode='view';S.draft={};go(S.rec?'record':'teachers')},
 savenew:saveNew,
 del(){delTeacher(S.rec)},
 tab(b){S.tab=b.dataset.id;render()},
 sort(b){const k=b.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};refresh()},
 restore(b){restore(b.dataset.id)},
 async binempty(){const ids=Object.keys(S.bin);if(!ids.length)return toast('The recycle bin is already empty.');if(await ask('Empty the recycle bin?',`<p>Permanently delete all ${ids.length} teacher(s) in the bin?</p>`,'Delete all',true))commit('Emptied the recycle bin',ids.map(id=>({p:'bin/'+id,b:S.bin[id],a:null})))},
 async revert(b){const h=S.hist.find(x=>x.id===b.dataset.id);if(!h||!h.ops)return;if(!(await ask('Revert this change?',`<p><b>${esc(h.label)}</b></p><p>The values from before this change are put back.</p>`,'Revert')))return;
  const ops=swap(JSON.parse(h.ops));if(await commit('Reverted: '+h.label,ops))toast('Change reverted.')},
 async phclear(){const id=S.rec;if(!S.photo[id])return;const old=S.photo[id];S.photo[id]='';await commit(`Photo of ${nm(S.T[id])} cleared`,[{p:'photos/'+id,b:{img:old},a:null}],{light:true});loadPhoto(id)},
 async fileup(){const f=$('#up_file').files[0];if(!f)return toast('Choose a file first.','bad');if(f.size>8*1024*1024)return toast('That file is over 8 MB.','bad');const t=S.T[S.rec];setSync('saving','Uploading');
  try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
   ingest(await server('apiUpload',{tid:t.id,cat:$('#up_cat').value,item:$('#up_item').value.trim(),name:f.name,type:f.type},b64));setSync('live','Live');toast('Document uploaded.');render()}
  catch(e){setSync('live','Live');toast(errText(e),'bad')}},
 async fileopen(b){setSync('saving','Opening');try{const r=await server('apiFile',b.dataset.id);const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);saveBlob(new Blob([u],{type:r.type}),r.name);toast('Document downloaded.')}catch(e){toast(errText(e),'bad')}setSync('live','Live')},
 async filedel(b){const f=S.files[b.dataset.id];if(!f||!(await ask('Remove this document?',`<p><b>${esc(f.name)}</b> is removed for everyone and moved to the Google Drive bin.</p>`,'Remove',true)))return;
  try{ingest(await server('apiFileDelete',b.dataset.id));toast('Document removed.');render()}catch(e){toast(errText(e),'bad')}},
 signout(){signOut()},
 trnew(){if(S.canWrite)trForm(null)},
 tredit(b){if(S.canWrite)trForm(b.dataset.id)},
 async logodel(){const old=S.logo;if(!old)return;await commit('School logo removed',[{p:'photos/LOGO',b:{img:old},a:null}],{light:true});S.logo='';paintLogo();render()},
 cadd(){saveContacts([...S.contacts,{role:'',officer:'',email:''}])},
 idcard(){idCard(S.T[S.rec])},
 yrsave(){saveYears()},yrback(){viewYear(actY())},yrnext(){startNextYear()},
 email(){emailDlg(S.T[S.rec])},
 export:exportXlsx,
 close:closeDialog};
function saveContacts(rows){const old=S.contacts,had=S.hasContacts;return commit('Email contacts changed',[{p:'settings/contacts',b:had?{rows:old}:null,a:{rows}}]).then(ok=>{if(ok)render()})}

/* delegated input handling */
const deb={};
document.addEventListener('input',e=>{const el=e.target;const m=/^q_(\w+)$/.exec(el.id||'');if(m){S.q[m[1]]=el.value;clearTimeout(deb.q);deb.q=setTimeout(refresh,120)}
  if(el.dataset.k&&S.mode==='new')S.draft[el.dataset.k]=el.value});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.k){if(S.mode==='new')S.draft[el.dataset.k]=el.value;else if(S.view==='record')saveField(el.dataset.k,el.value,el);return}
  if(el.id==='pick'){const id=idFrom(el.value);if(S.T[id]){S.rec=id;S.mode='view';render()}return}
  if(el.id==='listpick'){S.list=el.value;S.filters={};render();return}
  if(el.dataset.filter){S.filters[el.dataset.filter]=el.value;refresh();return}
  if(el.id==='listsort'){S.listSort=el.value;refresh();return}
  if(el.id==='trf_year'){S.trYear=el.value;refresh();return}
  if(el.id==='trf_type'){S.trType=el.value;refresh();return}
  if(el.id==='schoolpick'){S.school=el.value;refresh();return}
  if(el.id==='schoolmode'){S.schoolMode=el.value;refresh();return}
  if(el.dataset.ck){const rows=S.contacts.map(c=>({...c}));rows[+el.dataset.c][el.dataset.ck]=el.value.trim();saveContacts(rows.filter(c=>c.role||c.officer||c.email));return}
  if(el.dataset.list&&el.tagName==='TEXTAREA'){const n=el.dataset.list,vals=el.value.split('\n').map(s=>s.trim()).filter(Boolean);const old=S.lists;const nw={...(old||{}),[n]:vals};commit(`${LIST_NAMES[n]} list changed`,[{p:'settings/lists',b:old,a:nw}]);return}
  if(el.id==='ph_in'&&el.files[0]){const id=S.rec;try{const img=await shrink(el.files[0]);const old=S.photo[id];await commit(`Photo of ${nm(S.T[id])} changed`,[{p:'photos/'+id,b:old?{img:old}:null,a:{img}}],{light:true});loadPhoto(id)}catch(x){toast('Could not read that image.','bad')}return}
  if(el.id==='logo_in'&&el.files[0]){try{const img=await shrinkLogo(el.files[0]);const old=S.logo;if(await commit('School logo changed',[{p:'photos/LOGO',b:old?{img:old}:null,a:{img}}],{light:true})){S.logo=img;paintLogo();render();toast('Logo saved. Everyone sees it next time they open the app.')}}catch(x){toast('Could not use that image. Try a smaller PNG or JPG.','bad')}el.value='';return}
  if(el.id==='imp_in'&&el.files[0]){importXlsx(el.files[0]);el.value=''}});
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>45000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}d.length>45000?rej():res(d)};im.onerror=rej;im.src=u})}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

/* ---------- ID card ---------- */
async function idCard(t){const c=document.createElement('canvas');c.width=1012;c.height=638;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,1012,638);x.fillStyle='#26282c';x.fillRect(0,0,1012,128);x.fillStyle='#b3261e';x.fillRect(0,128,1012,10);
  x.fillStyle='#fff';x.font='700 44px "Barlow Condensed",Arial';x.fillText('PNG EDUCATION · WESTERN PROVINCE',36,58);x.font='600 30px "Barlow Condensed",Arial';x.fillText('TEACHER IDENTIFICATION CARD',36,102);
  const rows=[['Name',nm(t)],['Teacher ID',t.id],['Position',t.position],['Sector',t.sector],['School',t.school],['School Code',t.schoolCode],['Valid Until','31 December '+(new Date().getFullYear()+1)]];
  rows.forEach(([l,v],i)=>{const y=196+i*52;x.fillStyle='#666a70';x.font='500 24px "IBM Plex Sans",Arial';x.fillText(l,36,y);x.fillStyle='#1d1f22';x.font=(i?'500':'700')+' 28px "IBM Plex Sans",Arial';x.fillText(String(v||''),220,y,500)});
  x.strokeStyle='#bbb';x.lineWidth=2;x.strokeRect(748,170,228,280);x.fillStyle='#888';x.font='500 22px "IBM Plex Sans",Arial';
  const img=S.photo[t.id];if(img){await new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.max(228/im.width,280/im.height),w=im.width*s,h=im.height*s;x.save();x.beginPath();x.rect(748,170,228,280);x.clip();x.drawImage(im,748+(228-w)/2,170+(280-h)/2,w,h);x.restore();r()};im.onerror=r;im.src=img})}else x.fillText('PHOTO',826,318);
  x.fillStyle='#666a70';x.font='400 20px "IBM Plex Sans",Arial';x.fillText('Authorised by: Division of Education, Middle Fly District',36,580);x.fillText('If found, return to the Division of Education office.',36,610);
  const url=c.toDataURL('image/png');const d=dialog(`<h2>Teacher ID card</h2><img class="idc" alt="ID card for ${esc(nm(t))}" src="${url}"><div class="row"><button class="btn" data-act="close">Close</button><button class="btn pri" id="idsave">Download picture</button></div>`);
  const b=$('#idsave',d);b.onclick=()=>c.toBlob(bl=>{saveBlob(bl,`ID_${t.id}.png`);toast('ID card saved. Open the picture to print it.')})}
/* ---------- Email ---------- */
function emailDlg(t){const cs=S.contacts.filter(c=>c.email);if(!cs.length){toast('Add officer email addresses in Setup first.','bad');return}
  const mk=c=>({subj:`TDBMS - ${nm(t)} (${t.id})`,body:`Dear ${c.officer} (${c.role}),\n\nPlease find the details of the following teacher:\n\nTeacher ID: ${t.id}\nName: ${nm(t)}\nPosition: ${t.position||''}\nSector: ${t.sector||''}\nSchool: ${t.school||''}  (${t.schoolCode||''})\nPosting Status: ${t.postStatus||''}\nQualification: ${t.qual||''}\nLeave Status: ${t.leaveStatus||''}\n\nRegards,\n\nCONFIDENTIAL INFORMATION`});
  const d=dialog(`<h2>Email an officer</h2><label class="fld" for="em_to"><span>Send to</span><select id="em_to">${cs.map((c,i)=>`<option value="${i}">${esc(c.role)} · ${esc(c.officer)}</option>`).join('')}</select></label><p>Address: <b id="em_addr"></b></p><textarea id="em_body" aria-label="Message"></textarea><p class="sub">Copy the message, or open it in your mail app to send it.</p><div class="row"><button class="btn" data-act="close">Close</button><button class="btn" id="em_copy">Copy message</button><a class="btn pri" id="em_go" target="_top">Open in mail app</a></div>`);
  const up=()=>{const c=cs[+$('#em_to',d).value],m=mk(c);$('#em_addr',d).textContent=c.email;$('#em_body',d).value=m.body;$('#em_go',d).href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(m.subj)}&body=${encodeURIComponent(m.body)}`};
  $('#em_to',d).onchange=up;up();$('#em_copy',d).onclick=async()=>{try{await navigator.clipboard.writeText($('#em_body',d).value);toast('Message copied.')}catch(e){toast('Select the text and copy it by hand.','bad')}}}
/* ---------- Excel import / export ---------- */
function loadXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportXlsx(){try{await loadXlsx()}catch(e){return toast('Could not load the Excel library. Check your connection.','bad')}
  const rows=[['WESTERN PROVINCIAL ADMINISTRATION, DIVISION OF EDUCATION - MIDDLE FLY'],['TEACHERS DATABASE (exported '+new Date().toLocaleDateString()+')'],COLS.map(c=>c[1])];
  teachers().forEach(t=>rows.push(COLS.map(([k])=>t[k]??'')));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'TeachersDB');
  const tr=[['Transfer ID',...TR.map(c=>c[1]),'Recorded by','Recorded on'],...Object.values(S.X).sort((a,b)=>cmp(a.date,b.date)).map(x=>[x.id,...TR.map(c=>x[c[0]]||''),x.by||'',x.at||''])];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tr),'Transfers');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`TDBMS_TeachersDB_${S.viewYear||actY()}${S.viewYear?'_closed':''}_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Excel file saved.')}
async function importXlsx(file){try{await loadXlsx()}catch(e){return toast('Could not load the Excel library. Check your connection.','bad')}
  let wb;try{const buf=await file.arrayBuffer();wb=XLSX.read(buf,{type:'array',sheets:'TeachersDB'});if(!wb.Sheets['TeachersDB'])wb=XLSX.read(buf,{type:'array'})}catch(e){return toast('That file could not be read as a workbook.','bad')}
  const ws=wb.Sheets['TeachersDB']||wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=aoa.findIndex(r=>r.includes('Teacher ID')&&r.includes('Surname'));if(hi<0)return toast('No TeachersDB header row (Teacher ID, Surname…) found in that file.','bad');
  const head=aoa[hi].map(h=>String(h).trim()),map={};COLS.forEach(([k,l])=>{const i=head.indexOf(l);if(i>=0)map[k]=i});
  const conv=(k,v)=>{if(v===''||v==null)return '';if(FM[k].type==='date'){if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(String(v));return m?m[0]:String(v)}return clean(k,v)};
  const ops=[];let add=0,chg=0,same=0,mx=parseInt(nextId().slice(4),10);
  for(const r of aoa.slice(hi+1)){const rec={};Object.keys(map).forEach(k=>rec[k]=conv(k,r[map[k]]));if(!rec.surname&&!rec.given)continue;let id=String(rec.id||'').trim();if(!id){id='TSC-'+String(mx++).padStart(4,'0')}rec.id=id;
    const cur=S.T[id];if(!cur){const a={};KEYS.forEach(k=>a[k]=rec[k]??'');a.id=id;ops.push({p:'teachers/'+id,b:null,a,auto:true});add++}
    else{const b={},a={};Object.keys(map).forEach(k=>{if(k!=='id'&&String(cur[k]??'')!==rec[k]){b[k]=String(cur[k]??'');a[k]=rec[k]}});if(Object.keys(a).length){ops.push({p:'teachers/'+id,b,a});chg++}else same++}}
  if(!ops.length)return toast(same?'Nothing to import: all '+same+' teachers already match.':'No teacher rows found in that file.');
  if(!(await ask('Import from Excel',`<p>From <b>${esc(file.name)}</b>:</p><p>${add} new teacher(s), ${chg} updated, ${same} unchanged.</p><p>You can take the whole import back with Undo.</p>`,'Import')))return;
  if(await commit(`Imported ${add+chg} teacher(s) from Excel`,ops))toast('Import complete.')}

/* ---------- sign-in and live refresh ---------- */
function creds(v){try{if(v===undefined)return JSON.parse(localStorage.getItem('tdbms_auth')||'null');v?localStorage.setItem('tdbms_auth',JSON.stringify(v)):localStorage.removeItem('tdbms_auth')}catch(e){return null}}
function showLogin(msg){S.loaded=false;document.body.classList.add('out');setSync('off','Signed out');
  let lg='';try{lg=S.logo||localStorage.getItem('tdbms_logo')||''}catch(e){}
  const org=($('#orgline')||{}).textContent||'';
  $('#main').innerHTML=`<div class="lg-wrap"><div class="lg-card">
   <div class="lg-brand">${lg?`<img class="lg-logo" id="lg_logo" src="${lg}" alt="Logo">`:`<div class="lg-logo none" id="lg_logo">TDBMS</div>`}
    <div class="lg-title">TDBMS Teachers Database</div><div class="org">${esc(org).replace(/ · /g,'<br>')}</div><div class="sch">Authorised staff only</div></div>
   <form class="lg-form" id="login" onsubmit="return false"><h1>${ic('lock')}Sign in</h1><p class="sub">Use the name and PIN given to you by the administrator.</p>
   ${msg?`<div class="note">${esc(msg)}</div>`:''}
   <label class="lg-f" for="li_name"><span>${ic('user')}Your name</span><select id="li_name"><option value="">Loading names…</option></select></label>
   <label class="lg-f" for="li_pin"><span>${ic('hash')}PIN</span><input id="li_pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter your PIN"></label>
   <button class="lg-go" id="li_go" type="button">${ic('signin')}<span>Sign in</span></button>
   <p class="lg-help">Forgot your PIN? Ask the administrator.</p>${window.__inst?'<button type="button" class="btn" id="li_inst" style="margin:10px auto 0;display:flex">Install TDBMS on this device</button>':''}</form></div>${ownerFoot()}</div>`;
  if(!lg)call('apiLogo').then(img=>{if(!img)return;try{localStorage.setItem('tdbms_logo',img)}catch(e){}const el=$('#lg_logo');if(el)el.outerHTML=`<img class="lg-logo" id="lg_logo" src="${img}" alt="Logo">`}).catch(()=>{});
  decorate();
  const sel=$('#li_name'),last=(creds()||{}).name||localStorage.getItem('tdbms_last')||'';
  const fill=n=>{sel.innerHTML='<option value="">— Tap to choose your name —</option>'+n.map(x=>`<option${x===last?' selected':''}>${esc(x)}</option>`).join('');if(sel.value)$('#li_pin').focus()};
  let cn=null;try{cn=JSON.parse(localStorage.getItem('tdbms_names')||'null')}catch(e){}
  if(S.userList)fill(S.userList);else{if(cn&&cn.length)fill(cn);
   call('apiNames').then(n=>{S.userList=n;try{localStorage.setItem('tdbms_names',JSON.stringify(n))}catch(e){}const s2=$('#li_name');if(s2&&s2.tagName==='SELECT'&&(!s2.value||s2.value===last))fill(n)})
    .catch(()=>{const s2=$('#li_name');if(!(cn&&cn.length)&&s2)s2.outerHTML='<input id="li_name" autocomplete="username" placeholder="Type your name">'})}

async function signIn(a,quiet){AUTH=a;const st=await call('apiLogin',a);window.__ok=true;creds(a);try{localStorage.setItem('tdbms_last',a.name)}catch(e){}ingest(st);reapplyOutbox();S.loaded=true;S.offline=false;setTimeout(flush,500);call('apiPhoto',a,'LOGO').then(img=>{S.logo=img||'';try{img?localStorage.setItem('tdbms_logo',img):localStorage.removeItem('tdbms_logo')}catch(e){}paintLogo();if(S.view==='setup')render()}).catch(()=>{});document.body.classList.remove('out');setSync('live',S.canWrite?'Live':'Live · view only');btns();quiet?soon():render()}
